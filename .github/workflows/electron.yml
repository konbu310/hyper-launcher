name: Electron CD

on:
  push:
    tags:
      - "v*"

# Minimal permissions: only write access needed for creating releases
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Package
        run: npx electron-builder --config ./electron-builder.config.js

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**/*.dmg
            release/**/*.zip
